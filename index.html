<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kinozettel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Kinozettel HH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#121110;--panel:#1b1a18;--panel2:#23211e;--line:#34312c;--ink:#f1ece2;--muted:#a39d91;--dim:#6f6a61;--accent:#e8b04a;--accent-ink:#1a1408;--red:#d9614c;--green:#7fb77e;--blue:#7aa6d6;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-weight:700;font-size:30px;letter-spacing:-.03em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.stand{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;color:var(--muted)}
.hi{font-size:13px;color:var(--muted);margin-top:6px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
nav button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;color:var(--muted)}
nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px;margin-bottom:14px}
.note b{color:var(--ink)}
.err{border-left-color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.day{margin:26px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.day h2,.sec{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{margin:28px 0 10px}
.show{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.show.planned{border-color:var(--accent)}
.time{font-family:"Geist Mono",ui-monospace,monospace;font-size:18px;color:var(--accent)}
.ft{font-weight:600;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--muted)}
.ver{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);margin-left:6px}
.ver.ou{color:var(--blue);border-color:#33465c}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.empty{color:var(--dim);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0;line-height:1.25}
.status{font-size:12px;font-weight:600;align-self:flex-start;padding:2px 8px;border-radius:999px}
.st-run{background:#24361f;color:var(--green)} .st-off{background:var(--panel2);color:var(--dim)} .st-seen{background:#1f2c3a;color:var(--blue)} .st-soon{background:#3a2f17;color:var(--accent)}
.next{font-size:13px} .next .t{font-family:"Geist Mono",ui-monospace,monospace;color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.why{font-size:13px;color:var(--muted)}
form.add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input[type=text],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;flex:1;min-width:160px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.plan{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:8px}
.prog{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.prog .times{font-size:13px;color:var(--muted);margin-top:4px}
.prog .times span{font-family:"Geist Mono",ui-monospace,monospace;color:var(--ink)}
.info{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){.ov{align-items:center}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;padding:18px;max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.sheet p{margin:12px 0}
.sheet .x{float:right;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
a.btn{color:var(--ink);text-decoration:none;display:inline-block}
.toprow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
@media (max-width:520px){.show{grid-template-columns:52px 1fr}.show .act{grid-column:1/-1}.time{font-size:16px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Kinozettel <span>HH</span></h1><div class="hi" id="hi"></div></div>
    <div class="stand" id="stand">lädt …</div>
  </header>
  <nav id="nav">
    <button data-v="woche" class="on">Diese Woche</button>
    <button data-v="watch">Watchlist</button>
    <button data-v="programm">Programm</button>
    <button data-v="tipps">Tipps</button>
    <button data-v="profil">Profil</button>
  </nav>
  <main id="main"></main>
  <div id="modal"></div>
</div>
<script>
const SB_URL = 'https://xvhuljefiqvprabpapcb.supabase.co';
const SB_KEY = 'sb_publishable_E7jP8kgVCX3kTVs9KICmcA_M9TXuCkh';

const S = { token:null, me:null, prog:null, filme:null, info:null, view:'woche', fOV:false, fEve:false, q:'', err:'', loading:true };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'], MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const nowHM = () => { const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const dLabel = iso => { const d=new Date(iso+'T12:00:00'); return WD[d.getDay()]+', '+d.getDate()+'. '+MO[d.getMonth()]; };
const dShort = iso => { const d=new Date(iso+'T12:00:00'); return WD[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'; };
const stamp = iso => { if(!iso) return ''; const d=new Date(iso); return d.getDate()+'.'+(d.getMonth()+1)+'. '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const isOU = v => /om|ov|orig/i.test(v||'');
const norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\b(the|der|die|das|a)\b/g,' ').replace(/\s+/g,' ').trim();
function sameFilm(a, b){
  const x = norm(a), y = norm(b); if(!x || !y) return false;
  if(x === y) return true;
  const [s, l] = x.length < y.length ? [x, y] : [y, x];
  return s.length >= 4 && (l.startsWith(s + ' ') || l.includes(' ' + s + ' ') || l.endsWith(' ' + s));
}

// --- Supabase RPC ---
async function rpc(fn, args){
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args) });
  if(!r.ok){ let m=''; try{ m=(await r.json()).message||''; }catch(_){} throw new Error(m || ('HTTP '+r.status)); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
async function reload(){ S.me = await rpc('kz_me', {p_token:S.token}); }
async function act(fn, args){
  try { await rpc(fn, Object.assign({p_token:S.token}, args)); await reload(); S.err=''; }
  catch(e){ S.err = 'Speichern hat nicht geklappt: ' + e.message; }
  render();
}

// --- Daten ---
function upcoming(){
  if(!S.prog || !Array.isArray(S.prog.items)) return [];
  const t = todayISO(), n = nowHM();
  return S.prog.items.filter(x => x.date > t || (x.date === t && x.time >= n)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
const activeFilms = () => (S.me && S.me.films || []).filter(f => f.status === 'watch');
const filmFor = title => activeFilms().find(f => sameFilm(f.title, title));
function infoFor(title){
  const list = S.filme && Array.isArray(S.filme.items) ? S.filme.items : [];
  const e = list.find(i => [i.t, ...(i.a||[])].some(n => sameFilm(n, title)));
  const tip = S.prog && Array.isArray(S.prog.tipps) ? S.prog.tipps.find(t => sameFilm(t.title, title)) : null;
  return { title: (e && e.t) || title, director: (e && e.d) || (tip && tip.director) || '', year: (e && e.y) || (tip && tip.year) || '', text: (e && e.s) || '' };
}
const infoT = t => ` class="info" data-info="${esc(t)}"`;
function vInfo(){
  if(!S.info) return '';
  const i = infoFor(S.info);
  const sub = [i.director, i.year].filter(Boolean).map(esc).join(' · ');
  const q = encodeURIComponent(i.title + ' Film ' + (i.year||''));
  return `<div class="ov" id="ov"><div class="sheet" role="dialog" aria-label="${esc(i.title)}"><button class="x" id="ovx" aria-label="Schließen">×</button>
    <h3>${esc(i.title)}</h3>${sub?`<div class="meta">${sub}</div>`:''}
    ${i.text ? `<p>${esc(i.text)}</p>` : `<p class="meta">Zu diesem Film gibt es noch keine Kurzbeschreibung.</p>`}
    <a class="btn ghost" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Mehr im Web</a></div></div>`;
}
const planKey = x => x.title+'|'+x.cinema+'|'+x.date+'|'+x.time;

// --- Ansichten ---
function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  $('#stand').textContent = S.prog && S.prog.updatedAt ? 'Programm-Stand ' + stamp(S.prog.updatedAt) : (S.loading ? 'lädt …' : '');
  $('#hi').textContent = S.me ? 'Hallo ' + S.me.name : '';
  let h = '';
  if(S.err) h += `<div class="note err">${esc(S.err)}</div>`;
  if(!S.token) h += `<div class="note err"><b>Kein persönlicher Link.</b> Öffne die App über den Link, den du bekommen hast.</div>`;
  else if(S.loading) h += `<div class="empty">Lade …</div>`;
  else if(!S.me) h += `<div class="note err"><b>Dieser Link ist ungültig.</b> Frag nach deinem persönlichen Link.</div>`;
  else h += ({woche:vWoche, watch:vWatch, programm:vProg, tipps:vTipps, profil:vProfil})[S.view]();
  $('#main').innerHTML = h;
  $('#modal').innerHTML = vInfo();
  bind();
}
function vWoche(){
  let h = '';
  const plans = S.me.plans || [];
  if(plans.length){
    h += `<div class="sec">Vorgemerkt</div>` + plans.map(p => `<div class="plan"><div><span class="ft info" data-info="${esc(p.title)}">${esc(p.title)}</span> <span class="meta">· ${esc(dShort(p.date))} ${esc(p.time)} · ${esc(p.cinema)}${p.version?' · '+esc(p.version):''}</span></div><button class="btn ghost" data-unplan="${esc(p.id)}">Entfernen</button></div>`).join('');
  }
  h += `<div class="filters"><button class="chip ${S.fOV?'on':''}" data-f="ov">Nur OmU / OV</button><button class="chip ${S.fEve?'on':''}" data-f="eve">Nur ab 18 Uhr</button></div>`;
  let list = upcoming().filter(x => filmFor(x.title));
  if(S.fOV) list = list.filter(x => isOU(x.version));
  if(S.fEve) list = list.filter(x => x.time >= '18:00');
  if(!activeFilms().length) return h + `<div class="empty">Deine Watchlist ist noch leer. Trag Filme unter „Watchlist“ ein oder stöber im „Programm“.</div>`;
  if(!list.length) return h + `<div class="empty">Von deiner Watchlist läuft gerade nichts in den nächsten Tagen.</div>`;
  let cur = '';
  for(const x of list){
    if(x.date !== cur){ cur = x.date; h += `<div class="day"><h2>${esc(dLabel(x.date))}</h2></div>`; }
    const planned = plans.some(p => planKey(p) === planKey(x));
    h += `<div class="show ${planned?'planned':''}"><div class="time">${esc(x.time)}</div>
      <div><div class="ft"><span${infoT(x.title)}>${esc(x.title)}</span>${x.version?`<span class="ver ${isOU(x.version)?'ou':''}">${esc(x.version)}</span>`:''}</div><div class="meta">${esc(x.cinema)}</div></div>
      <div class="act">${planned?`<button class="btn" disabled>Vorgemerkt ✓</button>`:`<button class="btn pri" data-plan="${esc(planKey(x))}">Vormerken</button>`}</div></div>`;
  }
  return h;
}
function vWatch(){
  let h = `<form class="add" id="addForm"><input type="text" id="addTitle" placeholder="Film hinzufügen – Titel" autocomplete="off"><button class="btn pri" type="submit">Hinzufügen</button></form>`;
  const films = (S.me.films || []).filter(f => f.status !== 'skip');
  const act = films.filter(f => f.status === 'watch'), seen = films.filter(f => f.status === 'seen');
  const up = upcoming();
  const card = f => {
    const shows = f.status === 'watch' ? up.filter(x => sameFilm(f.title, x.title)) : [];
    const st = f.status === 'seen' ? ['st-seen','Gesehen'] : shows.length ? ['st-run', `Läuft · ${shows.length} Termin${shows.length>1?'e':''}`] : ['st-off','Gerade nicht im Programm'];
    return `<div class="card"><span class="status ${st[0]}">${st[1]}</span><h3${infoT(f.title)}>${esc(f.title)}</h3>${f.note?`<div class="why">${esc(f.note)}</div>`:''}
      ${shows.slice(0,3).map(x => `<div class="next"><span class="t">${esc(dShort(x.date))} ${esc(x.time)}</span> ${esc(x.cinema)}${x.version?' · '+esc(x.version):''}</div>`).join('')}
      <div class="row">${f.status==='seen'?`<button class="btn ghost" data-st="${esc(f.id)}|watch">Doch nicht gesehen</button>`:`<button class="btn" data-st="${esc(f.id)}|seen">Gesehen</button>`}<button class="btn ghost" data-st="${esc(f.id)}|skip">Entfernen</button></div></div>`;
  };
  act.sort((a,b) => (up.some(x=>sameFilm(b.title,x.title))?1:0) - (up.some(x=>sameFilm(a.title,x.title))?1:0));
  h += act.length ? `<div class="grid">${act.map(card).join('')}</div>` : `<div class="empty">Noch nichts auf der Watchlist.</div>`;
  if(seen.length) h += `<div class="sec">Gesehen</div><div class="grid">${seen.map(card).join('')}</div>`;
  return h;
}
function vProg(){
  const up = upcoming();
  const by = new Map();
  for(const x of up){ const k = norm(x.title); if(!by.has(k)) by.set(k, {title:x.title, shows:[]}); by.get(k).shows.push(x); }
  let films = [...by.values()].sort((a,b)=>a.title.localeCompare(b.title,'de'));
  if(S.q) films = films.filter(f => norm(f.title).includes(norm(S.q)) || f.shows.some(x => norm(x.cinema).includes(norm(S.q))));
  if(S.fOV) films = films.filter(f => f.shows.some(x => isOU(x.version)));
  let h = `<div class="filters"><input type="search" id="q" placeholder="Film oder Kino suchen" value="${esc(S.q)}" style="max-width:320px"><button class="chip ${S.fOV?'on':''}" data-f="ov">Nur OmU / OV</button></div>`;
  h += `<div class="note">Alles, was in den nächsten Tagen in den Hamburger Programmkinos läuft${S.prog&&S.prog.window?' ('+esc(dShort(S.prog.window.from))+' – '+esc(dShort(S.prog.window.to))+')':''}. Titel antippen für eine Kurzbeschreibung, mit „+ Watchlist“ merkst du dir einen Film.</div>`;
  if(!films.length) return h + `<div class="empty">${up.length?'Nichts gefunden.':'Das Programm wird gerade aktualisiert – schau später nochmal rein.'}</div>`;
  return h + films.map(f => {
    const on = !!filmFor(f.title);
    const cinemas = [...new Set(f.shows.map(x=>x.cinema))];
    const first = f.shows.slice(0,4).map(x => `<span>${esc(dShort(x.date))} ${esc(x.time)}</span> ${esc(x.cinema)}${x.version?' ('+esc(x.version)+')':''}`).join(' · ');
    return `<div class="prog"><div class="toprow"><div><div class="ft"><span${infoT(f.title)}>${esc(f.title)}</span></div><div class="meta">${esc(cinemas.join(', '))} · ${f.shows.length} Termin${f.shows.length>1?'e':''}</div></div>
      ${on?`<button class="btn" disabled>✓</button>`:`<button class="btn pri" data-take="${esc(f.title)}">+ Watchlist</button>`}</div><div class="times">${first}${f.shows.length>4?' …':''}</div></div>`;
  }).join('');
}
function vTipps(){
  const it = S.prog && Array.isArray(S.prog.tipps) ? S.prog.tipps : [];
  let h = `<div class="note">Neustarts und Empfehlungen aus den Hamburger Programmkinos – jede Woche neu.</div>`;
  if(!it.length) return h + `<div class="empty">Diese Woche noch keine Tipps.</div>`;
  return h + `<div class="grid">` + it.map(s => {
    const on = !!filmFor(s.title);
    return `<div class="card"><span class="status ${s.running?'st-run':'st-soon'}">${esc(s.where||'')}</span><h3${infoT(s.title)}>${esc(s.title)}</h3><div class="meta">${esc([s.director,s.year].filter(Boolean).join(' · '))}</div><div class="why">${esc(s.why||'')}</div>
      <div class="row">${on?`<button class="btn" disabled>Auf der Watchlist ✓</button>`:`<button class="btn pri" data-take="${esc(s.title)}">+ Watchlist</button>`}</div></div>`;
  }).join('') + `</div>`;
}
function vProfil(){
  const p = S.me.profile || {};
  return `<div class="note">Was du gern siehst – hilft bei den Tipps. Alles freiwillig.</div>
  <label class="f">Genres & Filme, die du magst</label><textarea id="pLikes">${esc(p.likes||'')}</textarea>
  <label class="f">Lieblingsregie</label><input type="text" id="pDirectors" value="${esc(p.directors||'')}">
  <label class="f">Lieblingskinos</label><input type="text" id="pCinemas" value="${esc(p.cinemas||'')}">
  <label class="f">Lieber nicht</label><textarea id="pAvoid">${esc(p.avoid||'')}</textarea>
  <div style="margin-top:16px"><button class="btn pri" id="pSave">Speichern</button> <span class="meta" id="pSaved"></span></div>
  <div class="note" style="margin-top:28px"><b>Tipp:</b> Auf dem iPhone in Safari „Teilen → Zum Home-Bildschirm“ – dann ist der Kinozettel wie eine App da. Den Link nicht weitergeben, er ist dein persönlicher Zugang.</div>`;
}

function bind(){
  document.querySelectorAll('[data-info]').forEach(el => el.onclick = e => { e.stopPropagation(); S.info = el.dataset.info; render(); });
  const ov = $('#ov'); if(ov) ov.onclick = e => { if(e.target.id === 'ov' || e.target.id === 'ovx'){ S.info = null; render(); } };
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { if(b.dataset.f==='ov') S.fOV=!S.fOV; else S.fEve=!S.fEve; render(); });
  document.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => {
    const x = upcoming().find(y => planKey(y) === b.dataset.plan); if(!x) return; b.disabled = true;
    act('kz_plan', {p_title:x.title, p_cinema:x.cinema, p_date:x.date, p_time:x.time, p_version:x.version||''});
  });
  document.querySelectorAll('[data-unplan]').forEach(b => b.onclick = () => { b.disabled = true; act('kz_unplan', {p_plan:b.dataset.unplan}); });
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { const [id, st] = b.dataset.st.split('|'); b.disabled = true; act('kz_set_status', {p_film:id, p_status:st}); });
  document.querySelectorAll('[data-take]').forEach(b => b.onclick = () => { b.disabled = true; addFilm(b.dataset.take); });
  const af = $('#addForm'); if(af) af.onsubmit = e => { e.preventDefault(); const t = $('#addTitle').value.trim(); if(t) addFilm(t); };
  const q = $('#q'); if(q) q.oninput = () => { S.q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos,pos); };
  const ps = $('#pSave'); if(ps) ps.onclick = async () => {
    ps.disabled = true;
    await act('kz_save_profile', {p_profile:{ likes:$('#pLikes').value.trim(), directors:$('#pDirectors').value.trim(), cinemas:$('#pCinemas').value.trim(), avoid:$('#pAvoid').value.trim() }});
    const sv = $('#pSaved'); if(sv && !S.err) sv.textContent = 'Gespeichert ✓';
  };
}
function addFilm(title){
  const ex = (S.me.films||[]).find(f => sameFilm(f.title, title));
  if(ex){ if(ex.status !== 'watch') act('kz_set_status', {p_film:ex.id, p_status:'watch'}); else render(); return; }
  act('kz_add_film', {p_title:title, p_note:''});
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.info){ S.info = null; render(); } });
$('#nav').onclick = e => { const b = e.target.closest('button'); if(!b) return; S.view = b.dataset.v; try{ localStorage.setItem('kz_view', S.view); }catch(_){} render(); };

(async () => {
  const qs = new URLSearchParams(location.search);
  S.token = qs.get('k') || (()=>{ try{ return localStorage.getItem('kz_token'); }catch(_){ return null; } })();
  if(qs.get('k')){ try{ localStorage.setItem('kz_token', qs.get('k')); }catch(_){} }
  try{ const v = localStorage.getItem('kz_view'); if(v) S.view = v; }catch(_){}
  render();
  const progP = fetch('data/programm.json?v=' + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
  const filmeP = fetch('data/filme.json?v=' + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
  if(S.token){ try{ await reload(); } catch(e){ S.err = 'Verbindung zur Datenbank fehlgeschlagen: ' + e.message; } }
  S.prog = await progP;
  S.filme = await filmeP;
  S.loading = false;
  render();
})();
</script>
</body>
</html>
